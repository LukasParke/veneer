# Called by the cargo-dist release workflow (dist-workspace.toml: publish-jobs).
# Publishes ghcr.io/<owner>/veneer:<version> and :<major> — a scratch image holding only the
# static binary, for `COPY --from=ghcr.io/lukasparke/veneer:1 /veneer /usr/local/bin/veneer`.
name: publish-image
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for arch in x86_64 aarch64; do
            gh release download "$TAG" -p "veneer-$arch-unknown-linux-musl.tar.xz"
            mkdir -p "bin/$arch" && tar -xJf "veneer-$arch-unknown-linux-musl.tar.xz" -C "bin/$arch" --strip-components=1
          done
          mkdir -p bin/linux/amd64 bin/linux/arm64
          mv bin/x86_64/veneer bin/linux/amd64/veneer
          mv bin/aarch64/veneer bin/linux/arm64/veneer
      - name: Build and push
        run: |
          version="${TAG#v}"
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          cat > Dockerfile.release <<'DOCKERFILE'
          FROM scratch
          ARG TARGETPLATFORM
          COPY bin/${TARGETPLATFORM}/veneer /veneer
          ENTRYPOINT ["/veneer"]
          DOCKERFILE
          docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile.release \
            -t "ghcr.io/$owner/veneer:$version" -t "ghcr.io/$owner/veneer:${version%%.*}" --push .
